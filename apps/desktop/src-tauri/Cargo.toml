[package]
name = "idlebiz-desktop"
description = "The IdleBiz desktop shell"
authors = ["kyh"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "idlebiz_desktop"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
getrandom = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSProcessInfo",
  "NSString",
  "objc2-core-services",
] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
