appId: com.idlebiz.desktop
productName: IdleBiz
directories:
  buildResources: resources
  output: .output/bin
files:
  - .output/app/**/*
  - package.json
asarUnpack:
  - resources/**
  # All of node_modules, not a hand-picked list. The ACP agents are spawned as
  # child processes, and nothing inside an asar archive can be executed — but
  # unpacking only the agent packages breaks them differently, because their
  # own dependencies stay archived and module resolution fails. Unpacking the
  # closure by hand is whack-a-mole; the app's own code stays in the asar.
  - node_modules/**
mac:
  # zip alongside dmg so electron-updater (latest-mac.yml) works when we add it
  target:
    - dmg
    - zip
  artifactName: IdleBiz-${version}-${arch}-mac.${ext}
  category: public.app-category.games
  icon: resources/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
dmg:
  artifactName: IdleBiz-${version}-${arch}.${ext}
npmRebuild: false
# A notarized app should not be relaunchable as a debugger's host: no --inspect,
# no NODE_OPTIONS, nothing loaded from outside the asar. runAsNode stays on — the
# ACP agents are spawned through ELECTRON_RUN_AS_NODE.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: kyh
  repo: idlebiz
  releaseType: release
