name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the token only checks the repo out, since no step writes to it: a wider default the repo or the
# org sets later does not reach this workflow
permissions:
  contents: read

env:
  # turbo and Next report their use unless told not to, and a CI run reports nothing
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # what the Turbo cache step saves, oldest entries out first: turbo never evicts unasked, and
  # every cache of the repo's shares 10GB
  TURBO_CACHE_MAX_SIZE: 1GB

jobs:
  ci:
    runs-on: ubuntu-latest
    # a backstop: a cold run is a quarter of it, and a hung step would otherwise hold the runner
    # for GitHub's default six hours
    timeout-minutes: 30
    steps:
      # no later step reaches the remote, so the token is not left behind in .git/config
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # Tauri compiles the desktop shell against WebKitGTK on Linux (the Mac ships its own
      # WebKit), and its menu-bar icon loads the appindicator at runtime: AGENTS.md's Linux list,
      # less the C toolchain the runner ships
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # the toolchain apps/desktop/rust-toolchain.toml pins, which `typecheck` (clippy) and `test` run
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # the newest run's turbo cache on this OS: a task whose inputs the commit left alone replays
      # its last pass, but apps/cli's tests, which skip on the CLIs a machine has, always run
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The app ships only as a macOS arm64 .app, and only a Mac compiles the shell's own code (the
  # Keychain, the login item, keeping awake), runs the seal and the gate suites, boots the pack and
  # founds a company end to end (e2e-macos). Typecheck, lint, knip, format and build read no
  # platform, so the ci job alone runs them.
  test-macos:
    runs-on: macos-latest
    # a backstop: the shell's release build for the pack is minutes of it cold
    timeout-minutes: 60
    env:
      # three cores and 7 GB: main's suites beside the shell's compile, four at once, push the
      # timing-bound gate tests past their limits
      TEST_CONCURRENCY: 2
    steps:
      # as the ci job's: no later step reaches the remote
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # the gate suites drive the real CLIs through the app's adapters against a stand-in model on
      # loopback, so none signs in or bills. Pinned by hand: a global install rides no lockfile, and
      # a bump must pass the gates here. claude's and agent-browser's install scripts set their
      # native binaries in place, and pnpm runs none it is not allowed
      - name: Gate CLIs
        run: |
          pnpm add -g --allow-build=@anthropic-ai/claude-code --allow-build=agent-browser \
            @anthropic-ai/claude-code@2.1.292 @openai/codex@0.154.0 agent-browser@0.37.0
          agent-browser install

      # each gate suite skips on a CLI that does not answer this, which would pass it unseen
      - name: Gate CLIs answer
        run: claude --version && codex --version && agent-browser --version

      - name: Shell clippy
        run: pnpm -F @repo/desktop typecheck

      - name: Test
        run: pnpm test

      - name: Smoke the packaged app
        env:
          # ad-hoc: the runner's keychain holds no Developer ID
          IDLEBIZ_PACK_UNSIGNED: 1
        run: pnpm smoke:desktop

      # what the seal refused while the gates or the smoke ran, which a run's own output may not
      # say: Seatbelt logs each deny to the system log by process, operation and path, and these
      # are the ones under the runner's home or TMPDIR
      - name: Seal denials
        if: ${{ failure() }}
        run: |
          sudo log show --last 60m --style compact --predicate 'sender == "Sandbox"' \
            | grep -E 'deny\(' | grep -E '/(private/)?var/folders/|/Users/runner/' \
            | tail -n 400 || true

  # The office end to end on a Mac, the one platform that seals a run: each launch signs the CLIs
  # the adapters bundle in to a stand-in model on loopback, so nothing signs in or bills, and a test
  # that would skip fails instead. A runner of its own beside test-macos: it needs no Rust, and
  # stays clear of the smoke's single-instance socket and Keychain checks.
  e2e-macos:
    runs-on: macos-latest
    # a backstop over the suite's own step
    timeout-minutes: 40
    steps:
      # as the ci job's: no later step reaches the remote
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # a key of its own, so it never races test-macos to save one, restored from either's last
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-${{ runner.os }}-

      # the Chromium the suite drives, cached under the Playwright version the lockfile holds: a
      # bump fetches the new build, nothing else does. Only the headless shell, all CI runs
      - name: E2E browser version
        id: playwright
        working-directory: tools/e2e
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: E2E browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: E2E browser
        run: pnpm -F @repo/e2e exec playwright install --only-shell chromium

      # Playwright's own global timeout is 20 minutes, and the build ahead of it in this step a few
      # more, so the reporters still write before this one. The run tests drive real CLIs, two at
      # once on the runner's three cores, each for up to 5 minutes
      - name: E2E
        timeout-minutes: 30
        env:
          # a skipped test fails the run, as a gate CLI that does not answer fails test-macos: here
          # every founding test can run, and one that skips would pass unseen
          IDLEBIZ_E2E_NO_SKIPS: 1
        run: pnpm e2e

      # what the seal refused while the suite ran, as test-macos's step reads it, into the artifact
      - name: Seal denials
        if: ${{ failure() }}
        run: |
          mkdir -p tools/e2e/test-results
          sudo log show --last 45m --style compact --predicate 'sender == "Sandbox"' \
            | grep -E 'deny\(' | grep -E '/(private/)?var/folders/|/Users/runner/' | tail -n 3000 \
            > tools/e2e/test-results/seal-denials.log || true
          tail -n 60 tools/e2e/test-results/seal-denials.log

      # every run's SUMMARY.md, results.json and key screenshots, and a failure's trace and
      # screenshot; .last-run.json feeds --last-failed. Public, as the repo is: every key a test
      # types is a fake one
      - name: E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: tools/e2e/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
