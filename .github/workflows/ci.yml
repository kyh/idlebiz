name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # what the Turbo cache step saves, oldest entries out first: turbo never evicts unasked, and
  # every cache of the repo's shares 10GB
  TURBO_CACHE_MAX_SIZE: 1GB

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # Tauri compiles the desktop shell against WebKitGTK on Linux (the Mac ships its own
      # WebKit), and its menu-bar icon loads the appindicator at runtime: AGENTS.md's Linux list,
      # less the C toolchain the runner ships
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # the toolchain apps/desktop/rust-toolchain.toml pins, which `typecheck` (clippy) and `test` run
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # the newest run's turbo cache on this OS: a task whose inputs the commit left alone replays
      # its last pass, but apps/cli's tests, which skip on the CLIs a machine has, always run
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The app ships only as a macOS arm64 .app, and only a Mac compiles the shell's own code (the
  # Keychain, the login item, keeping awake), runs the seal and the gate suites, and boots the pack.
  # Typecheck, lint, knip, format and build read no platform, so the ci job alone runs them.
  test-macos:
    runs-on: macos-latest
    # a backstop: the shell's release build for the pack is minutes of it cold
    timeout-minutes: 60
    env:
      # three cores and 7 GB: main's suites beside the shell's compile, four at once, push the
      # timing-bound gate tests past their limits
      TEST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # the gate suites drive the real CLIs through the app's adapters against a stand-in model on
      # loopback, so none signs in or bills. Pinned by hand: a global install rides no lockfile, and
      # a bump must pass the gates here. claude's and agent-browser's install scripts set their
      # native binaries in place, and pnpm runs none it is not allowed
      - name: Gate CLIs
        run: |
          pnpm add -g --allow-build=@anthropic-ai/claude-code --allow-build=agent-browser \
            @anthropic-ai/claude-code@2.1.292 @openai/codex@0.153.4 agent-browser@0.37.0
          agent-browser install

      # each gate suite skips on a CLI that does not answer this, which would pass it unseen
      - name: Gate CLIs answer
        run: claude --version && codex --version && agent-browser --version

      - name: Shell clippy
        run: pnpm -F @repo/desktop typecheck

      - name: Test
        run: pnpm test

      - name: Smoke the packaged app
        env:
          # ad-hoc: the runner's keychain holds no Developer ID
          IDLEBIZ_PACK_UNSIGNED: 1
        run: pnpm smoke:desktop
