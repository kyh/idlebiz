name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # Tauri compiles the desktop shell against WebKitGTK on Linux (the Mac ships its own
      # WebKit), and its menu-bar icon loads the appindicator at runtime
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # the toolchain apps/desktop/rust-toolchain.toml pins, which `typecheck` (clippy) and `test` run
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
