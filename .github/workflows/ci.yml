name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # what the Turbo cache step saves, oldest entries out first: turbo never evicts unasked, and
      # every cache of the repo's shares 10GB
      TURBO_CACHE_MAX_SIZE: 1GB
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # Tauri compiles the desktop shell against WebKitGTK on Linux (the Mac ships its own
      # WebKit), and its menu-bar icon loads the appindicator at runtime
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # the toolchain apps/desktop/rust-toolchain.toml pins, which `typecheck` (clippy) and `test` run
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # the newest run's turbo cache on this OS: a task whose inputs the commit left alone replays
      # its last pass, but apps/cli's tests, which skip on the CLIs a machine has, always run
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
