name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the token only checks the repo out, since no step writes to it: a wider default the repo or the
# org sets later does not reach this workflow
permissions:
  contents: read

env:
  # turbo and Next report their use unless told not to, and a CI run reports nothing
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # what the Turbo cache step saves, oldest entries out first: turbo never evicts unasked, and
  # every cache of the repo's shares 10GB
  TURBO_CACHE_MAX_SIZE: 1GB

jobs:
  ci:
    runs-on: ubuntu-latest
    # a backstop: a cold run is a quarter of it, and a hung step would otherwise hold the runner
    # for GitHub's default six hours
    timeout-minutes: 30
    steps:
      # no later step reaches the remote, so the token is not left behind in .git/config
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # the newest run's turbo cache on this OS: a task whose inputs the commit left alone replays
      # its last pass, but apps/cli's tests, which skip on the CLIs a machine has, always run
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
