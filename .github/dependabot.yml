version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # as long as pnpm's own minimumReleaseAge (a day), so no PR proposes a version pnpm holds back
    cooldown:
      default-days: 1
    groups:
      # one PR for the adapters and the sdk, which CI's test-macos job runs the gate suites on
      acp:
        patterns:
          - "@agentclientprotocol/*"
      # one PR for the oRPC beta family: each member pins its siblings exactly, so a lone bump
      # installs a second oRPC beside the first, and each beta breaks the last
      orpc:
        patterns:
          - "@orpc/*"
      # one PR for Tailwind and its plugins: each plugin pins its tailwindcss exactly, so a lone
      # bump installs a second beside the first
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # one PR for Electron and the builder and updater that pack and update it: the updater reads
      # what the builder writes, and CI's test-macos and update-macos jobs pack and update on them
      electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
          - "electron-vite"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
