packages:
  - apps/*
  - packages/*

# One declaration per dep that more than one workspace uses, so versions
# cannot drift between them.
catalog:
  "@agentclientprotocol/sdk": ^1.4.0
  "@types/node": ^26.4.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  zod: ^4.5.2

allowBuilds:
  electron-winstaller: true
  electron: true
  esbuild: true
  sharp: true

updateConfig:
  ignoreDependencies:
    - typescript
