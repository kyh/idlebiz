packages:
  - apps/*
  - packages/*
  - tools/*

# One declaration per dep that more than one workspace uses, so versions
# cannot drift between them, and the ACP adapters.
allowBuilds:
  electron-winstaller: false
  msw: set this to true or false

catalog:
  # Exact: a bump changes the wire acp-session.ts speaks.
  "@agentclientprotocol/claude-agent-acp": 0.85.1
  "@agentclientprotocol/codex-acp": 1.12.0
  "@agentclientprotocol/sdk": 1.7.0
  # Exact: a caret would float onto later betas, and each breaks the last.
  "@orpc/client": 2.0.0-beta.53
  "@orpc/contract": 2.0.0-beta.53
  "@orpc/publisher": 2.0.0-beta.53
  "@orpc/server": 2.0.0-beta.53
  "@orpc/tanstack-query": 2.0.0-beta.53
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  cn: ^0.4.0
  msw: ^3.0.7
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7

minimumReleaseAgeExclude:

updateConfig:
  ignoreDependencies:
    - typescript
