packages:
  - apps/*
  - packages/*
  - tools/*

# One declaration per dep that more than one workspace uses, so versions
# cannot drift between them.
catalog:
  "@agentclientprotocol/sdk": ^1.7.0
  "@orpc/client": 2.0.0-beta.42
  "@orpc/contract": 2.0.0-beta.42
  "@orpc/server": 2.0.0-beta.42
  "@types/node": ^24.19.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  cn: ^0.4.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vitest: ^5.0.3
  zod: ^4.6.5

allowBuilds:
  esbuild: true
  sharp: true

updateConfig:
  ignoreDependencies:
    - typescript

patchedDependencies:
  "@agentclientprotocol/codex-acp@1.12.0": patches/@agentclientprotocol__codex-acp@1.12.0.patch
